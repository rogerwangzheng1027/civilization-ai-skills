name: Publish Personal Plugin ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-plugin-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build validated distribution archive
        run: python3 scripts/build_plugin_distribution.py

      - name: Create versioned immutable release (no overwrite)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("plugins/civilization-ai-specialists/plugin.json"))["version"])')"
          TAG="civilization-ai-specialists-v$VERSION"
          ASSET="dist/CIVILIZATION-AI-Specialists-v$VERSION.zip"

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::Version $VERSION is already tagged at $TAG_SHA. Bump the plugin version to release changed content. No existing archive will be replaced."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Preserving existing version, no overwrite."
            exit 0
          fi

          cat > dist/RELEASE_NOTES.md <<'NOTES'
          CIVILIZATION AI Specialists — personal, private-installable Plugin package.
          Contains original Project Hub and four independent Specialist SKILL.md files,
          LANGUAGE_CONTROL.md, PROJECT_STATE_TEMPLATE.md, and related documentation.
          The ZIP has plugin.json at its root. No MCP server.
          To install, download the ZIP and upload it to Plugin Creator in your own ChatGPT.
          This is a fixed release snapshot, not an automatic sync. Later updates require
          a new version and the user's explicit approval before replacement.
          NOTES

          gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "CIVILIZATION AI Specialists v$VERSION" --notes-file dist/RELEASE_NOTES.md
          echo "RELEASED $TAG"
