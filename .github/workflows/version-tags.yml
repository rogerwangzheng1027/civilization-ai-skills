name: Version Tags

on:
  push:
    branches:
      - main
    paths:
      - ".github/version-tags.tsv"
      - ".github/workflows/version-tags.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest
        uses: actions/checkout@v4

      - name: Create verified version tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          created=0
          skipped=0

          while IFS=$'\t' read -r tag sha label; do
            [[ -z "${tag:-}" || "${tag:0:1}" == "#" ]] && continue

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "SKIP existing tag: $tag"
              skipped=$((skipped + 1))
              continue
            fi

            if ! gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" >/dev/null 2>&1; then
              echo "ERROR missing commit for $tag: $sha" >&2
              exit 1
            fi

            tag_object_sha=$(gh api               --method POST               "repos/$GITHUB_REPOSITORY/git/tags"               -f tag="$tag"               -f message="$label"               -f object="$sha"               -f type="commit"               --jq '.sha')

            gh api               --method POST               "repos/$GITHUB_REPOSITORY/git/refs"               -f ref="refs/tags/$tag"               -f sha="$tag_object_sha" >/dev/null

            echo "CREATE $tag -> $sha"
            created=$((created + 1))
          done < .github/version-tags.tsv

          echo "Created: $created"
          echo "Skipped existing: $skipped"
